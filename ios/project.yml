# Xcode projesi bu dosyadan üretilir: `xcodegen generate` (Mac'te, ios/ klasöründe).
name: GiseTabelasi
options:
  bundleIdPrefix: com.ojfamilia
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
packages:
  GameCore:
    path: GameCore
targets:
  GiseTabelasi:
    type: application
    platform: iOS
    scheme: {} # paylaşılan şema: komut satırından (CI) derleme için gerekli
    sources:
      - path: App
    dependencies:
      - package: GameCore
    preBuildScripts:
      - name: Validate strings
        basedOnDependencyAnalysis: false
        script: |
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          if command -v node >/dev/null 2>&1; then
            node "${SRCROOT}/../tools/check-strings.mjs"
          else
            echo "warning: node bulunamadı, metin doğrulaması atlandı"
          fi
    settings:
      base:
        # Apple Developer > Identifiers altında birebir bu kimlik kayıtlı olmalı.
        PRODUCT_BUNDLE_IDENTIFIER: com.ojfamilia.gisetabelasi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Skyscraper Swing
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.arcade-games
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
