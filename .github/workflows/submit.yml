# Uygulamayı Apple'ın incelemesine gönderir. Yalnızca "submit-*" etiketiyle, bilerek başlatılır.
name: İncelemeye gönder

on:
  push:
    tags:
      - "submit-*"

jobs:
  submit:
    name: İncelemeye gönder
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v5
      - name: Gönder
        run: |
          python3 -m pip install --quiet pyjwt cryptography
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          KEY_PATH="$KEY_PATH" python3 tools/asc-submit.py
      - name: API anahtarını sil
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
