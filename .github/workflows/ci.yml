# 1) Metin doğrulama (Linux, ucuz): her gönderimde.
# 2) Oyun mantığı testleri ve 3) simülatör derlemesi (macOS, ücretsiz kotanın 10 katı hızla harcar):
#    yalnızca elle tetiklenince. TestFlight derlemesi uygulamayı zaten derler.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Metin doğrulama
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Metinler
        run: node tools/check-strings.mjs

  core-tests:
    name: Oyun mantığı testleri
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Swift sürümü
        run: swift --version
      - name: swift test
        working-directory: ios/GameCore
        run: swift test

  build-app:
    name: iOS derlemesi (simülatör)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    needs: validate
    steps:
      - uses: actions/checkout@v5
      - name: XcodeGen kur
        run: brew install xcodegen
      - name: Xcode projesini üret
        working-directory: ios
        run: xcodegen generate
      - name: Derle
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project GiseTabelasi.xcodeproj \
            -scheme GiseTabelasi \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
